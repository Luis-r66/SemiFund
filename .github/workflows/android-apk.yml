name: APK Android

# Compila el APK y lo adjunta a la release de GitHub con el nombre
# SemiFund.apk, que es el que busca la app para actualizarse.
#
# Se puede lanzar a mano (Actions > APK Android > Run workflow) indicando el
# tag, o automáticamente al empujar un tag vX.Y.Z.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release (ej. v1.6.2); debe existir"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.8"
          cache: true

      - name: Instalar dependencias
        working-directory: mobile
        run: flutter pub get

      # El build release usa la firma debug (no hay keystore propio), así que
      # no hacen falta secretos para compilar en CI.
      - name: Compilar APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Renombrar a SemiFund.apk
        working-directory: mobile
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/SemiFund.apk
          ls -lh build/app/outputs/flutter-apk/SemiFund.apk

      - name: Adjuntar el APK a la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: mobile/build/app/outputs/flutter-apk/SemiFund.apk
          fail_on_unmatched_files: true
