name: Flutter Web

on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/flutter-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.8"
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar
        run: flutter analyze

      - name: Pruebas (sin golden)
        run: flutter test test/core test/models test/providers test/app_navigation_test.dart

      - name: Compilar web
        run: >-
          flutter build web --release
          --base-href /SemiFund/
          --dart-define=API_BASE_URL=https://semifund-api.onrender.com/api

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
