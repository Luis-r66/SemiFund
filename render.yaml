services:
  - type: web
    name: semifund-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: MAIL_MODE
        value: brevo
      - key: MAIL_FROM_NAME
        value: SemiFund
      - key: MAIL_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
